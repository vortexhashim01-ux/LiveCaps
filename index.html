<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta
      name="description"
      content="LiveCaps — on-device camera detection and face/pet recognition."
    />
    <!-- Both icons are derived from the LiveCaps logo (see public/). -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>LiveCaps</title>
    <!--
      WHY an inline script: it runs before React paints, so the page does not
      flash light-then-dark. It reads the same localStorage key that the
      Zustand theme store writes (see src/store/themeStore.ts).
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("moments.theme");
          var mode = raw ? JSON.parse(raw).state.mode : "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = mode === "dark" || (mode === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", dark);
        } catch (error) {
          /* A broken or blocked localStorage must never stop the app from loading. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
